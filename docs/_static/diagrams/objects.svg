<svg class="diagram" viewBox="0 0 760 425" role="img" aria-label="Objects of a running application and their relationships">
  <defs>
    <marker id="head-objects" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box accent" x="305" y="16" width="150" height="50" rx="10"/>
  <text class="title center" x="380" y="38">MainWindow</text>
  <text class="muted center" x="380" y="56">one per application</text>

  <path class="line" d="M380,66 V93 M95,93 H515"/>
  <line class="line" x1="95" y1="93" x2="95" y2="118" marker-end="url(#head-objects)"/>
  <line class="line" x1="300" y1="93" x2="300" y2="118" marker-end="url(#head-objects)"/>
  <line class="line" x1="515" y1="93" x2="515" y2="118" marker-end="url(#head-objects)"/>

  <rect class="box" x="20" y="120" width="150" height="50" rx="10"/>
  <text class="title center" x="95" y="142">Panels</text>
  <text class="muted center" x="95" y="160">rail, selection, popovers</text>

  <rect class="box" x="225" y="120" width="150" height="50" rx="10"/>
  <text class="title center" x="300" y="142">Builder</text>
  <text class="muted center" x="300" y="160">tool, fragment, mode</text>

  <rect class="box" x="436" y="126" width="170" height="50" rx="10"/>
  <rect class="box accent" x="430" y="120" width="170" height="50" rx="10"/>
  <text class="title center" x="515" y="142">Canvas</text>
  <text class="muted center" x="515" y="160">one per tab</text>

  <rect class="box" x="626" y="120" width="120" height="50" rx="10"/>
  <text class="title center" x="686" y="142">Tools</text>
  <text class="muted center" x="686" y="160">select, build, delete</text>

  <line class="line dashed" x1="170" y1="145" x2="223" y2="145" marker-end="url(#head-objects)"/>
  <line class="line dashed" x1="430" y1="145" x2="377" y2="145" marker-end="url(#head-objects)"/>
  <line class="line dashed" x1="606" y1="145" x2="624" y2="145" marker-end="url(#head-objects)"/>

  <path class="line" d="M515,176 V205 M265,205 H695"/>
  <line class="line" x1="265" y1="205" x2="265" y2="228" marker-end="url(#head-objects)"/>
  <line class="line" x1="410" y1="205" x2="410" y2="228" marker-end="url(#head-objects)"/>
  <line class="line" x1="555" y1="205" x2="555" y2="228" marker-end="url(#head-objects)"/>
  <line class="line" x1="695" y1="205" x2="695" y2="228" marker-end="url(#head-objects)"/>

  <rect class="box" x="200" y="230" width="130" height="50" rx="10"/>
  <text class="title center" x="265" y="252">Document</text>
  <text class="muted center" x="265" y="270">undo and signals</text>

  <rect class="box" x="345" y="230" width="130" height="50" rx="10"/>
  <text class="title center" x="410" y="252">Camera, Style</text>
  <text class="muted center" x="410" y="270">how the view looks</text>

  <rect class="box" x="490" y="230" width="130" height="50" rx="10"/>
  <text class="title center" x="555" y="252">SceneCache</text>
  <text class="muted center" x="555" y="270">arrays to draw</text>

  <rect class="box" x="635" y="230" width="120" height="50" rx="10"/>
  <text class="title center" x="695" y="252">GLRenderer</text>
  <text class="muted center" x="695" y="270">or QPainter</text>

  <path class="line" d="M265,280 V305 M185,305 H330"/>
  <line class="line" x1="185" y1="305" x2="185" y2="328" marker-end="url(#head-objects)"/>
  <line class="line" x1="330" y1="305" x2="330" y2="328" marker-end="url(#head-objects)"/>
  <path class="line" d="M555,280 V305 M500,305 H635"/>
  <line class="line" x1="500" y1="305" x2="500" y2="328" marker-end="url(#head-objects)"/>
  <line class="line" x1="635" y1="305" x2="635" y2="328" marker-end="url(#head-objects)"/>

  <rect class="box" x="120" y="330" width="130" height="50" rx="10"/>
  <text class="title center" x="185" y="352">Molecule</text>
  <text class="muted center" x="185" y="370">atoms, coords, bonds</text>

  <rect class="box" x="265" y="330" width="130" height="50" rx="10"/>
  <text class="title center" x="330" y="352">Undo stack</text>
  <text class="muted center" x="330" y="370">copies of Molecule</text>

  <rect class="box" x="440" y="330" width="120" height="50" rx="10"/>
  <text class="title center" x="500" y="352">Scene</text>
  <text class="muted center" x="500" y="370">drawing arrays</text>

  <rect class="box" x="575" y="330" width="120" height="50" rx="10"/>
  <text class="title center" x="635" y="352">Picker</text>
  <text class="muted center" x="635" y="370">hit testing</text>

  <line class="line" x1="230" y1="408" x2="268" y2="408" marker-end="url(#head-objects)"/>
  <text class="muted" x="276" y="412">owns</text>
  <line class="line dashed" x1="340" y1="408" x2="378" y2="408" marker-end="url(#head-objects)"/>
  <text class="muted" x="386" y="412">uses or observes</text>
</svg>
